<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopSense · Grounded Shopping Assistant</title>
<style>
:root{--bg:#f6f5fb;--panel:#fff;--fg:#1d1b2e;--mut:#6e6b85;--bd:#e7e5f2;--pri:#6d4aff;--pri2:#9b6bff;--ok:#12a150;--okbg:#e4f6ec;--no:#c43b3b;--nobg:#fcebeb;--warn:#d97706;--shadow:0 6px 24px rgba(60,40,140,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0e17;--panel:#1a1826;--fg:#eeedf7;--mut:#9a97b5;--bd:#2b2840;--okbg:#10301f;--nobg:#3a1818;--shadow:0 6px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--panel);box-shadow:var(--shadow)}
header{padding:14px 20px;display:flex;align-items:center;gap:12px;color:#fff;background:linear-gradient(120deg,var(--pri),var(--pri2))}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px}
header h1{margin:0;font-size:17px;line-height:1.2}header small{opacity:.85;font-size:12px}
header .sp{flex:1}.hb{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;text-decoration:none}
.hb:hover{background:rgba(255,255,255,.28)}
#filters{display:none;padding:8px 20px;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mut)}
.fc{background:var(--bg);border:1px solid var(--bd);color:var(--fg);padding:2px 10px;border-radius:99px}
#log{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hero{margin:auto;text-align:center;max-width:460px}.hero .big{font-size:44px}.hero h2{margin:6px 0 4px}.hero p{color:var(--mut);margin:0 0 16px}
.sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug button,.chip{border:1px solid var(--bd);background:var(--panel);color:var(--fg);border-radius:99px;padding:7px 14px;cursor:pointer;font-size:13px;transition:.15s}
.sug button:hover,.chip:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-1px)}
.row{display:flex;gap:10px;max-width:100%}.row.u{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(120deg,var(--pri),var(--pri2));display:grid;place-items:center;font-size:15px;flex:none}
.bub{padding:10px 14px;border-radius:16px;max-width:min(560px,100%)}
.u .bub{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;border-bottom-right-radius:4px}
.b .bub{background:var(--bg);border:1px solid var(--bd);border-bottom-left-radius:4px}
.b .bub.refuse{border-left:4px solid var(--warn)}.b .bub.clarify{border-left:4px solid var(--pri)}.b .bub.policy{border-left:4px solid var(--ok)}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.cards{display:grid;gap:10px;margin:8px 0;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.card .t{font-weight:600;line-height:1.3}.card .pr{font-size:21px;font-weight:700;color:var(--pri)}
.card .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.badge{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11px}.in{background:var(--okbg);color:var(--ok)}.out{background:var(--nobg);color:var(--no)}
.star{color:#f5a623}.id{font:600 11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--bd);color:var(--mut);padding:1px 7px;border-radius:6px}
.opt{width:100%;text-align:left;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:4px 0;cursor:pointer;color:var(--fg);transition:.15s}
.opt:hover{border-color:var(--pri);box-shadow:var(--shadow)}.opt b{display:block}.opt span{color:var(--mut);font-size:12px}
.lbl{font-size:12px;color:var(--warn);font-weight:600;margin-top:6px}
.cite{font:600 11px ui-monospace,monospace;background:var(--okbg);color:var(--ok);padding:1px 7px;border-radius:6px;margin-left:4px;white-space:nowrap}
details{margin-top:8px;font-size:12px;color:var(--mut)}summary{cursor:pointer}
.bars{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.bars span{background:var(--panel);border:1px solid var(--bd);padding:1px 8px;border-radius:6px}
.typing{display:flex;gap:4px;padding:6px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-4px)}}
form{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--bd);background:var(--panel)}
input{flex:1;padding:12px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font:inherit;outline:none}input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(109,74,255,.15)}
.send{border:0;border-radius:99px;padding:0 22px;color:#fff;font-weight:600;cursor:pointer;background:linear-gradient(120deg,var(--pri),var(--pri2))}
.foot{text-align:center;font-size:11px;color:var(--mut);padding:0 0 10px}
</style></head><body><div class="app">
<header><div class="logo">🛍️</div><div><h1>ShopSense</h1><small>Answers only from the catalogue · every claim cited</small></div><div class="sp"></div>
<a class="hb" href="/costs" target="_blank">Cost report</a><button class="hb" id="rs">New chat</button></header>
<div id="filters"></div><div id="log"></div>
<form id="f"><input id="q" autocomplete="off" placeholder="Ask about a product or policy… (Hinglish is fine)"><button class="send">Send</button></form>
<div class="foot">Prices and stock come straight from the catalogue snapshot</div></div>
<script>
const sid=crypto.randomUUID(),log=document.getElementById('log'),q=document.getElementById('q');
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const SUG=["do you sell iPhones?","blue running shoe price?","cotton kurta under 2000","return policy kitne din?","sasta leather wallet"];
function hero(){log.innerHTML='';const h=$('div','hero');h.append($('div','big','🛍️'),$('h2',null,'What are you shopping for?'),$('p',null,'Ask in English or Hinglish. If I don’t have it, I’ll say so instead of guessing.'));
 const s=$('div','sug');SUG.forEach(t=>{const b=$('button',null,t);b.onclick=()=>send(t);s.append(b)});h.append(s);log.append(h)}
function user(t){const h=log.querySelector('.hero');h&&h.remove();const r=$('div','row u');r.append($('div','bub',t));log.append(r);log.scrollTop=1e9}
function cite(id){return $('span','cite',id)}
function render(r){
 const bub=$('div','bub '+r.kind);let cards=null,lbl=null;
 for(const ln of r.text.split('\n')){
  let m=ln.match(/^(Closest without your filters: )?(?:\d+\.\s*)?(.+?) — (₹[\d,]+), (in stock|out of stock)(?:, rated ([\d.]+))? \[([^\]]+)\]$/);
  if(m){if(m[1]&&!lbl){lbl=$('div','lbl','Closest without your filters');bub.append(lbl)}
   if(!cards){cards=$('div','cards');bub.append(cards)}
   const c=$('div','card');c.append($('div','t',m[2]),$('div','pr',m[3]));
   const mt=$('div','meta');mt.append($('span','badge '+(m[4]==='in stock'?'in':'out'),m[4]));
   if(m[5])mt.append($('span','star','★ '+m[5]));mt.append($('span','id',m[6]));c.append(mt);cards.append(c);continue}
  cards=null;
  m=ln.match(/^(.+?) \[([^\]]+)\] — (.*)$/);
  if(m&&r.kind==='clarify'){const b=$('button','opt');b.append($('b',null,m[1]),$('span',null,m[3]+' · '+m[2]));b.onclick=()=>send(m[2]+' price');bub.append(b);continue}
  m=ln.match(/^(.*?) \[(POLICY §\d+)\]$/);
  if(m){const p=$('p',null,m[1]);p.append(cite(m[2]));bub.append(p);continue}
  if(ln.trim())bub.append($('p',null,ln));
 }
 if(r.options&&r.options.length){const d=$('div','sug');d.style.cssText='justify-content:flex-start;margin-top:8px';r.options.forEach(o=>{const b=$('button','chip',o);b.onclick=()=>send(o);d.append(b)});bub.append(d)}
 const dt=$('details');dt.append($('summary',null,`⏱ ${r.total_ms} ms · LLM tokens ${r.tokens.llm_in}/${r.tokens.llm_out}`));
 const bars=$('div','bars');Object.entries(r.timings).forEach(([k,v])=>bars.append($('span',null,k+' '+v+'ms')));dt.append(bars);bub.append(dt);return bub}
function filters(s){const f=document.getElementById('filters'),e=Object.entries(s);f.style.display=e.length?'flex':'none';f.innerHTML='';
 if(e.length){f.append('Active filters:');e.forEach(([k,v])=>f.append($('span','fc',k==='max'?'under ₹'+v:k==='min'?'above ₹'+v:v)))}}
async function send(t){user(t);const row=$('div','row b'),ty=$('div','bub');ty.append($('div','typing'));ty.firstChild.innerHTML='<i></i><i></i><i></i>';
 row.append($('div','av','🛍️'),ty);log.append(row);log.scrollTop=1e9;
 try{const r=await(await fetch('/chat',{method:'POST',body:JSON.stringify({session:sid,message:t})})).json();
  row.lastChild.replaceWith(render(r));filters(r.state)}catch(e){ty.textContent='Could not reach the server.'}
 log.scrollTop=1e9}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=q.value.trim();if(v){q.value='';send(v)}};
document.getElementById('rs').onclick=async()=>{await fetch('/reset',{method:'POST',body:JSON.stringify({session:sid})});filters({});hero()};
hero();q.focus();
</script></body></html>
